services:
  mongodb:
    image: mongo:7
    container_name: star-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: star_home_design

  app:
    build: .
    container_name: star-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/star_home_design
      JWT_SECRET: star_home_design_secret_2024
      PORT: 5000
    depends_on:
      - mongodb

volumes:
  mongodb_data:
